spec_version: verify_gap_spec_v1
frozen_at: '2026-11-01T02:37:45'
frozen_before: 'WP2: scoring of MIMIC index ECGs with EchoNext-Mini. No MIMIC score exists at freeze time.'
concept_snapshot: concept_frozen_2026-11-01.md
index_test:
  model: EchoNext-Mini (echonext_multilabel_minimodel), output lvef_lte_45 (index 0), frozen
  pipeline: afef src/mimic_to_echonext.py + src/08_mimic_tabular.py, unchanged (afef cohort_spec_v1)
  threshold:
    rule: 'EchoNext-Mini notebook cell 19: first roc_curve point with sensitivity >= 0.70, positive = score >= cutoff; EchoNext
      test split'
    positive_if_sigmoid_gte: 0.5675751566886902
    source_split_metrics:
      sensitivity:
      - 70.1
      - 67.0
      - 73.0
      specificity:
      - 83.6
      - 82.5
      - 84.7
      ppv:
      - 47.8
      - 45.3
      - 50.5
      npv:
      - 92.9
      - 92.1
      - 93.7
    rule_check_composite_shd_reproduced: true
  technical_exclusion: flat or missing leads, applied in WP2 when waveforms are read
cohort:
  unit: first ECG per patient in MIMIC-IV-ECG v1.0 (ecg_time, then study_id)
  exclusions:
  - not linked to MIMIC-IV patients or sex missing
  - age < 18 at index ECG
  - index ECG paced (any pacing statement, afef rhythm_rules_v2)
  - prior resting TTE with D = 1 (section 6.3 rule)
  - I50/428/I42/425 on an admission with dischtime < index ECG time
  not_excluded:
  - prosthetic valves (pre-index evidence enters X)
  - any non-paced rhythm
  setting_rule: ED if within an ED stay, else inpatient if within an admission, else outpatient
  flow:
  - step: first ECG per patient (MIMIC-IV-ECG)
    n_remaining: 161352
  - step: linked to MIMIC-IV patients, sex recorded
    n_remaining: 161332
    n_excluded: 20
  - step: age >= 18 at index ECG
    n_remaining: 161287
    n_excluded: 45
  - step: index ECG not paced
    n_remaining: 158903
    n_excluded: 2384
  - step: no prior TTE with LVEF <= 45
    n_remaining: 158262
    n_excluded: 641
  - step: no prior HF/cardiomyopathy code (dischtime < ECG)
    n_remaining: 157841
    n_excluded: 421
verification:
  V: first resting TTE with LVEF information, 0-30 days after the index ECG
  D_primary: biplane > reported range (midpoint rule for closed straddlers, lower-bound rule if open-ended) > 3D > text; LVEF
    <= 45
  D_sensitivity: all straddling studies D = 1
  window_sensitivity: 0-365 days
  V30: 26084
  V30_pct: 16.53
  G1:
    rule: '>= 100 verified (V30) cases with LVEF <= 45 (primary D rule)'
    verified_cases_primary: 4423
    verified_cases_sensitivity_straddle_as_1: 4908
    prevalence_among_verified_pct: 16.96
    V365_cases_primary: 5323
    passed: true
verification_model:
  form: logistic regression; AI score and age as restricted cubic splines
  X:
  - AI score
  - age
  - sex
  - era (approx year from anchor_year_group)
  - setting
  - ecg_af_flutter
  - ecg_lbbb
  - ecg_rbbb
  - ecg_infarct_q
  - ecg_lvh
  - ecg_low_voltage
  - qrs_ms
  - hr
  - prior_admission
  - prior_cad_mi
  - prior_af
  - prior_valve (incl. pre-index prosthesis)
  - prior_htn
  - prior_dm
  - prior_ckd
  - prior_copd
  - prior_tte_365
  - ed_cc_dyspnoea
  - ed_cc_chest_pain
  - ed_cc_syncope
  - ed_cc_oedema
  - ed_cc_other
  - ed_cc_missing
  codebooks:
  - outputs/codebook_icd.csv
  - outputs/codebook_ecg_statements.csv
  - outputs/codebook_ed_cc.csv
estimators:
  naive: verified only
  primary: IPW 1/P(V=1|X), weights truncated at 99th percentile
  mnar:
    lambda:
    - 0.25
    - 0.5
    - 0.75
    - 1
    - 1.5
    - 2
    consistency_check: lambda = 1 ~ IPW
  bootstrap: 1000 patient resamples, models refitted, threshold fixed
  primary_estimand: delta sens and delta spec (naive - IPW); materiality 5 percentage points
  gate_G2: naive AUROC >= 0.80
